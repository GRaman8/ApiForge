# Local development stack: Postgres + the API.
# Usage:  docker compose up --build
# The API auto-applies EF migrations on startup in the Development environment.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: apiforge
      POSTGRES_USER: apiforge
      POSTGRES_PASSWORD: apiforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apiforge"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=apiforge;Username=apiforge;Password=apiforge"
      Jwt__Key: "local-dev-only-insecure-signing-key-change-me-32bytes-minimum!!"
      Jwt__Issuer: ApiForge
      Jwt__Audience: ApiForgeClients
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
